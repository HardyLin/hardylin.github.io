<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>選擇聲音朗讀</title>
</head>
<body>
  <h2>SpeechSynthesisUtterance 選擇聲音朗讀</h2>

  <input
    id="textInput"
    type="text"
    placeholder="請輸入要朗讀的文字"
    style="width: 300px; padding: 8px;"
  />

  <br /><br />

  <select id="voiceSelect" style="width: 320px; padding: 8px;">
    <option>載入 voices 中...</option>
  </select>

  <br /><br />

  <button id="speakBtn">朗讀</button>

  <script>
    const textInput = document.getElementById("textInput");
    const voiceSelect = document.getElementById("voiceSelect");
    const speakBtn = document.getElementById("speakBtn");

    let voices = [];

    function loadVoices() {
      voices = window.speechSynthesis.getVoices();

      voiceSelect.innerHTML = "";

      voices.forEach((voice) => {
        const option = document.createElement("option");

        option.textContent = `${voice.name} (${voice.lang})`;
        option.setAttribute("data-name", voice.name);

        if (voice.lang === "zh-TW") {
          option.selected = true;
        }

        voiceSelect.appendChild(option);
      });
    }

    // 有些瀏覽器 voices 會非同步載入
    window.speechSynthesis.onvoiceschanged = loadVoices;

    // 先執行一次
    loadVoices();

    function speakText() {
      const text = textInput.value.trim();

      if (!text) {
        alert("請先輸入文字");
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);

      // 你指定的寫法
      const selectedOption =
        voiceSelect.selectedOptions[0].getAttribute("data-name");

      // 用 data-name 找出對應的 voice
      const selectedVoice = voices.find((voice) => {
        return voice.name === selectedOption;
      });

      if (selectedVoice) {
        utterance.voice = selectedVoice;
        utterance.lang = selectedVoice.lang;
      }

      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.volume = 1;

      window.speechSynthesis.speak(utterance);
    }

    speakBtn.addEventListener("click", speakText);
  </script>
</body>
</html>
